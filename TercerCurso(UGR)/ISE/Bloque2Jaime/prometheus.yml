---
global:
  scrape_interval: 5s
  
scrape_configs:
  - job_name: "prometheus_service"
    static_configs:
      - targets: ['prometheus:9090']
  
  - job_name: "node_exporter"
    static_configs:
      - targets: ["192.168.56.101:9100"]
      
  - job_name: 'api-nodejs'
    static_configs:
      - targets: ['172.17.0.1:3000']
      

